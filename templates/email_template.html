<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Email Template</title>
</head>

<body style="margin: 0; padding: 0; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; background-color: #f4f4f4;">
    <table align="center" border="0" cellpadding="0" cellspacing="0" width="100%" style="max-width: 600px; background-color: #ffffff; margin-top: 20px; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">
        <tr>
            <td style="background-color: #ffd1f7; padding: 20px; text-align: center; color: #2b2a2a;">
                <h1 style="margin: 0; font-size: 24px;">E-Visual Gallery</h1>
            </td>
        </tr>
        <tr>
            <td style="padding: 30px; color: #444444; line-height: 1.6;">
                <p style="font-size: 18px; margin-top: 0;">Hello <strong>{{ sender_name }}</strong>,</p>
                <p>Thank you for contributing to the <strong>Bangladesh Visual Diary</strong>. We've successfully received your upload!</p>
                
                <div style="background-color: #f9f9f9; border-left: 4px solid #ffd1f7; padding: 15px; margin: 20px 0; font-style: italic;">
                    "{{ photo_description }}"
                </div>
                
                <p style="font-size: 14px; color: #888;">Your photo has been attached to this email.</p>
            </td>
        </tr>
        <tr>
            <td style="background-color: #eeeeee; padding: 15px; text-align: center; font-size: 12px; color: #777777;">
                Sent from Bangladesh Visual Diary App &bull; 2026
            </td>
        </tr>
    </table>
</body>
</html>
