<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Email Template</title>
</head>
<style>
        body
         { 
          font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
         color: #333; 
         line-height: 1.6; 
     }
        .container
         { 
          width: 90%; 
          max-width: 600px;
           margin: 20px auto; 
          border: 1px solid #ddd;
           border-radius: 8px; 
          overflow: hidden; 
     
     }
        .header
         {
           background-color: #ffd1f7;
           color: rgb(27, 25, 25);
           padding: 20px;
           text-align: center;
      }
        .content
         { 
          padding: 20px;
      }
        .description-box
         { 
          background-color:  #ffd1f7; 
          border-left: 4px solid #4A90E2;
           padding: 15px; 
          margin: 15px 0;
           font-style: italic; 
     }
        .footer
         {
           font-size: 12px;
           text-align: center;
           color: #888; 
          padding: 10px;
      }
    </style>
<body>
     <div class="container">
        <div class="header">
            <h1>E-Visual Gallery</h1>
        </div>
        <div class="content">
            <p>Hello <strong>{{ sender_name }}</strong>,</p>
            <p>Thanks for sharing your photo with us! We have successfully received your upload.</p>
            
            <div class="description-box">
                "{{ photo_description }}"
            </div>

            <p>The image you uploaded is attached to this email for your records.</p>
        </div>
        <div class="footer">
            Sent via E-Visual Gallery App
        </div>
    </div>
</body>
</html>
