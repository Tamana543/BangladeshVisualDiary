<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/form.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/lightMode.css') }}">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
    <title>Edit Request</title>
    <style>
.modal-overlay {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.7);
    backdrop-filter: blur(5px);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 9999;
}

.modal-content {
    background: var(--dark-bg, #1a1a1a);
    color: white;
    padding: 30px;
    border-radius: 20px;
    text-align: center;
    max-width: 400px;
    width: 90%;
    box-shadow: 0 10px 40px rgba(248, 57, 153, 0.3); 
    border: 1px solid #f83999;
}

body.light .modal-content {
    background: white;
    color: #333;
}

.hidden { 
    display: none !important; 
}

#deleteRequestForm.light, 
#deleteRequestForm.formLight {
     margin-bottom: 0;
    color: #333333 !important;
    padding: 20px;
    border-radius: 8px;
    background-image: none !important;
}

#deleteRequestForm.light .formbold-form-label {
    color: #555555 !important;
}


#deleteRequestForm.light h3 {
    color: #000000 !important;
}

.form.formLight, .formbold-form-wrapper.light {
    background-color: #ffffff !important;
    color: #333 !important;
    box-shadow: 0px 10px 30px rgba(0,0,0,0.1);
}

body.light .formbold-form-label {
    color: #555 !important;
}
.svgContainer {
    width: 500px !important;
    height: 300px !important;

}
.github_link {

    right: 84px;
}
        .form_container {
             display: block !important; 
  
        }
        #homeBtn { 
              width: 8%;
            height: 6%;
             position: fixed;     
            top: -27px;
    right: 15px; 
    z-index: 1000; 
}

@media (max-width: 540px) {
    .svgContainer {
               width: 410px !important;
        height: 300px !important;
    }
    .formbold-btn {
               font-size: 17px !important;
        width: 60% !important;
    }
    #homeBtn {
        top: -10px;
    }
}
    
    </style>
</head>
<body>
    <div class="tdnn"><div class="moon"></div></div>

    <a href="/" class="addBtn" id="homeBtn">Home</a>
  <div class="svgContainer"></div>
   <a href="https://github.com/Tamana543" class="github_link"><span><img src="{{ url_for('static', filename='GitHub-logo.gif')}}" alt="Github" class="github_logo"></span></a>
    <a href="/" class="addBtn" id="homeBtn">Home</a>

    <div id="customAlert" class="modal-overlay hidden">
    <div class="modal-content">
        <div id="successAnim" style="width: 150px; height: 150px; margin: 0 auto;"></div>
        <h2 id="alertTitle">Success!</h2>
        <p id="alertMessage">Your request has been sent.</p>
        <button id="closeAlertBtn" class="formbold-btn">Great!</button>
    </div>
</div>
    <div class="form_container">
       
        <div class="form">
            <div class="formbold-main-wrapper">
                <div class="formbold-form-wrapper">
                    <form id="deleteRequestForm">
                        <h3 style="margin-bottom: 20px; color: var(--lightt);">Request Image Deletion</h3>
                        
                        <div class="formbold-mb-5">
                            <label for="senderName" class="formbold-form-label">Your Name:</label>
                            <input type="text" id="senderName" class="formbold-form-input" placeholder="Enter your Name" required />
                        </div>
                        
                        <div class="formbold-mb-5">
                            <label for="delImageName" class="formbold-form-label">Image Filename:</label>
                            <input type="text" id="delImageName" class="formbold-form-input" placeholder="e.g., sunset.jpg" required />
                        </div>
                        
                        <div class="formbold-mb-5">
                            <label for="reason" class="formbold-form-label">Reason for deletion:</label>
                            <textarea id="reason" class="formbold-form-input" style="height: 120px;" placeholder="Why should we delete this?"></textarea>
                        </div>
                        
                        <button type="submit" class="formbold-btn w-full" id="submitDelBtn">Send Delete Request</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='edit_req.js') }}"></script>
</body>
</html>
